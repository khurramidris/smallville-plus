[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallville-plus"
version = "0.1.0"
description = "Phase 1 research town: deterministic event engine and bounded model inference"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "litellm>=1.80,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-socket>=0.7", "httpx>=0.27", "ruff>=0.9"]

[project.scripts]
smallville = "smallville.cli:main"

[tool.setuptools.packages.find]
include = ["smallville*"]

[tool.setuptools.package-data]
smallville = ["data/**/*.json", "data/**/*.csv", "data/**/*.tmx", "viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
